# Passerelle Nginx vers le Django déjà lancé sur le PC (port 8000).
# Usage :
#   1. python manage.py runserver 0.0.0.0:8000
#   2. docker compose -f docker-compose.gateway.yml up
#   3. Lien LAN : http://<votre-ip-locale>/
#   4. Lien Internet (camarades hors Wi‑Fi) :
#      docker compose -f docker-compose.gateway.yml --profile share up

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: monexa_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx-host.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: monexa_tunnel
    profiles: ["share"]
    depends_on:
      - nginx
    command: tunnel --no-autoupdate --url http://nginx:80
    restart: unless-stopped
